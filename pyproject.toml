[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adalib-ode"
version = "0.1.0"
description = "ADA-based ODE forward solving, operator learning, and MPC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "tensorflow>=2.13",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "h5py>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "build>=1.0",
    "twine>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adalib*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow integration tests (deselect with -k 'not slow')",
]
