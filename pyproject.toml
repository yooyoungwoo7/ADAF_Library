[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adalib-IFL"
version = "0.1.8"
description = "ADAlib: Anti-Derivative Approximator (ADA) library for ODE forward simulation, inverse estimation, operator learning, and MPC, with the ADAlib Studio browser GUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Youngwoo Yoo" },
    { name = "Dayeong Kang" },
    { name = "Suhyeong Lim" },
    { name = "Sang-Hyun Rhie" },
    { name = "Jeongsu Lee", email = "leejeongsu@khu.ac.kr" },
]
keywords = ["ODE", "physics-informed", "operator learning", "model predictive control", "scientific machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "tensorflow>=2.13",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "h5py>=3.9",
    # ADAlib Studio (adalib_studio): local web server for the browser GUI
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "build>=1.0",
    "twine>=4.0",
    "httpx>=0.27",
]

[project.scripts]
adalib-studio = "adalib_studio.cli:main"

[project.urls]
Homepage = "https://github.com/yooyoungwoo7/ADAF_Library"
Documentation = "https://adaf-library.readthedocs.io/en/latest/"
Source = "https://github.com/yooyoungwoo7/ADAF_Library"

[tool.setuptools.packages.find]
where = ["."]
include = ["adalib*"]   # adalib and adalib_studio

[tool.setuptools.package-data]
# built frontend of ADAlib Studio (copied in by the Studio repo's scripts/sync_to_adalib.py)
adalib_studio = ["static/**/*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow integration tests (deselect with -k 'not slow')",
]
